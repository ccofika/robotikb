# Zadaci: stalni bez komentara (jedan dodir), stalni sa obaveznim komentarom (list), povremeni (komentar je uvek obavezan)
appId: com.robotik.mobile
---
- runFlow: start.yaml
- scrollUntilVisible:
    element:
      id: "tasks-section"
- scrollUntilVisible:
    element: "Obilazak po planu"
- tapOn:
    text: "Obilazak po planu"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "guard-toast-title"
      text: "Zadatak je označen"
    timeout: 15000
- tapOn:
    text: "Provera PP centrale na početku smene"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "task-sheet"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "Komentar (obavezno)"
- tapOn:
    id: "task-comment"
    retryTapIfNoChange: false
- inputText: "Centrala bez greske"
- hideKeyboard
- takeScreenshot: g06-stalni-sa-komentarom
- tapOn:
    id: "task-save"
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "task-sheet"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "occasional-task"
- tapOn:
    id: "occasional-task"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "task-sheet"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "Povremeni zadatak .*"
- tapOn:
    id: "task-comment"
    retryTapIfNoChange: false
- inputText: "Dostava primljena, kamion BG123"
- hideKeyboard
- tapOn:
    id: "task-save"
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "task-sheet"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Dostava primljena, kamion BG123.*"
- takeScreenshot: g06-zadaci-gotovi
- scrollUntilVisible:
    element: ".*Centrala bez greske.*"
    direction: UP
